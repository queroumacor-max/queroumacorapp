# Codemagic CI/CD — gera e ASSINA o AAB do Capacitor (o app DEFINITIVO, não o
# WebIntoApp, que é WebView pura sem push/câmera/OAuth nativo).
#
# Setup no painel do Codemagic (não em secret do GitHub):
#   1. Conectar este repositório; o Codemagic detecta este arquivo.
#   2. Code signing identities → Android keystores → subir `my-release-key.jks`
#      (o MESMO que assina o app no Play) com reference name `queroumacor_keystore`,
#      alias e senhas. Isso injeta CM_KEYSTORE_PATH/PASSWORD/KEY_ALIAS/KEY_PASSWORD.
#   3. (Opcional, pro push) Environment variables → grupo `firebase` →
#      GOOGLE_SERVICES_JSON = `base64 -w0 google-services.json` (marcar Secure).
#   4. (Deploy na Play) Environment variables → grupo `google_credentials` →
#      GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS = JSON da service account
#      (Secure). A service account precisa de permissão de Releases no app.
#
# O que a build faz: gera o AAB assinado, MANDA POR E-MAIL e SOBE AUTOMÁTICO na
# faixa `internal` (Internal Testing) da Play. Produção continua MANUAL (a regra
# do projeto: nunca ir direto pra produção — promover Internal→produção na Play
# Console). O versionCode é o maior da Play + 1 (auto), então nunca repete.
#
# Disparo: manual pelo painel (sem bloco `triggering`, não roda a cada push).
# Ver docs/ANDROID_AAB_CODEMAGIC.md.

workflows:
  android-aab:
    name: Android AAB (Capacitor)
    max_build_duration: 60
    # macOS M2 é a única máquina com minutos gratuitos no plano pessoal
    # (500/mês). Linux/Windows não têm cota grátis e exigem assinatura — foi o
    # que fez a primeira build morrer com "instance type is not available with
    # the current billing plan". Android compila normalmente em mac (a imagem
    # traz JDK + Android SDK).
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - queroumacor_keystore
      groups:
        - firebase            # fornece GOOGLE_SERVICES_JSON (opcional, push)
        - google_credentials  # fornece GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS (deploy Play)
      node: 20
      # Capacitor 8.x (bump 6→8, coordenado — ver git log) gera
      # `android/app/capacitor.build.gradle` com
      # sourceCompatibility/targetCompatibility VERSION_21 (era 17 no
      # Capacitor 6.x) — `npx cap sync android` confirmou local. Sem
      # bumpar aqui junto, o Android build quebra no Codemagic.
      java: 21
    cache:
      cache_paths:
        # $HOME e não `~`: o til não é expandido aqui, e o cache virava no-op —
        # na build #3 o "Restoring cache" durou <1s e o `npm ci` levou 7 dos 10
        # minutos.
        - $HOME/.npm
        - $HOME/.gradle/caches
    scripts:
      # versionCode = maior build number da Play + 1. Como cada build agora
      # SOBE na Play (publishing.google_play), o número não pode repetir nunca
      # (a Play rejeita duplicata). Sem `--tracks` o CLI devolve o maior de
      # TODAS as tracks; a credencial é lida do env GOOGLE_PLAY_SERVICE_ACCOUNT_
      # CREDENTIALS automaticamente (grupo google_credentials). Guardado: se o
      # CLI falhar (permissão, API), cai no ANDROID_VERSION_CODE manual ou 10202,
      # pra o passo de versão NUNCA derrubar a build. build.gradle lê essa env.
      - name: versionCode = maior da Play + 1
        script: |
          set +e
          LATEST=$(google-play get-latest-build-number --package-name br.com.queroumacor 2>/dev/null)
          RC=$?
          set -e
          if [ $RC -eq 0 ] && echo "$LATEST" | grep -qE '^[0-9]+$'; then
            NEXT=$((LATEST + 1))
            echo "Maior versionCode na Play: $LATEST → esta build: $NEXT"
          else
            NEXT="${ANDROID_VERSION_CODE:-10202}"
            echo "get-latest-build-number indisponível (rc=$RC) — fallback versionCode $NEXT"
          fi
          echo "ANDROID_VERSION_CODE=$NEXT" >> $CM_ENV
      - name: Install deps (Capacitor CLI + plugins)
        script: npm ci
      # webDir (next-app/.next/static) não existe em checkout limpo, e o app
      # carrega tudo de server.url — um placeholder basta pro `cap sync` gerar o
      # capacitor.config.json (que aponta pro https://www.queroumacor.com.br).
      - name: Placeholder webDir + Capacitor sync
        script: |
          # Pagina de fallback offline, embutida no app. O Capacitor a exibe
          # (server.errorPath) quando a carga de server.url falha — sem rede, DNS
          # fora, site fora do ar. Sem isso o usuario ve a tela de erro crua do
          # sistema, que e o classico motivo de reprovacao 4.2 na Apple.
          # O botao recarrega o site; a pagina nao depende de nada externo.
          mkdir -p next-app/.next/static
          cat > next-app/.next/static/offline.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>QueroUmaCor</title>
          <style>
            :root{color-scheme:dark}
            html,body{margin:0;height:100%;background:#1a1a2e;color:#fff;
              font:400 16px/1.6 -apple-system,system-ui,"Segoe UI",sans-serif;
              display:flex;align-items:center;justify-content:center;
              padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
              box-sizing:border-box;-webkit-user-select:none;user-select:none}
            .c{max-width:340px;text-align:center}
            .m{width:88px;height:88px;border-radius:50%;background:#FF6B35;margin:0 auto 22px;
              display:flex;align-items:center;justify-content:center;
              font:700 44px/1 -apple-system,system-ui,sans-serif;color:#fff}
            h1{font-size:21px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
            p{margin:0 0 26px;opacity:.72;font-size:15px}
            button{-webkit-appearance:none;appearance:none;border:0;width:100%;
              padding:16px;border-radius:14px;background:#FF6B35;color:#fff;
              font:700 16px -apple-system,system-ui,sans-serif;cursor:pointer}
            button:active{opacity:.8}
          </style>
          <div class="c">
            <div class="m">Q</div>
            <h1>Sem conexão</h1>
            <p>O QueroUmaCor precisa de internet para carregar. Verifique sua conexão e tente de novo.</p>
            <button onclick="location.replace('https://www.queroumacor.com.br')">Tentar de novo</button>
          </div>
          HTML
          echo '<!doctype html><title>QueroUmaCor</title>' > next-app/.next/static/index.html
          npx cap sync android
      - name: google-services.json (se houver)
        script: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            # openssl em vez de `base64 --decode`: a flag longa é do GNU e o
            # base64 do macOS (onde esta build roda) não a aceita.
            printf '%s' "$GOOGLE_SERVICES_JSON" | openssl base64 -d -A > android/app/google-services.json
            echo "google-services.json escrito (FCM habilitado)."
          else
            echo "SEM GOOGLE_SERVICES_JSON — AAB compila, mas push FCM não registra token."
          fi
      # O build.gradle lê android/key.properties (signingConfig condicional). O
      # Codemagic expõe o keystore em CM_KEYSTORE_PATH + senhas via android_signing.
      - name: key.properties a partir do keystore do Codemagic
        script: |
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build AAB assinado
        script: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - jackson.guerra@gmail.com
        notify:
          success: true
          failure: true
      # Sobe o AAB direto na faixa `internal` (Internal Testing). `track:
      # internal` respeita a regra "nunca ir direto pra produção" — a promoção
      # Internal→produção continua MANUAL na Play Console. `submit_as_draft:
      # false` = release completo pros testadores internos (não fica em rascunho).
      # A credencial vem do grupo google_credentials.
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false

  # ---------------------------------------------------------------------------
  # iOS — gera e ASSINA o IPA do wrapper Capacitor e sobe no TestFlight.
  #
  # Substitui o app WebIntoApp (repo `queroumacor-ios`, WebView pura sem
  # push/camera/OAuth nativo). Mesmo bundle ID `br.com.queroumacor.app` e mesma
  # ficha da App Store (Apple ID 6784256495), entao a build sobe como versao
  # nova do app que ja esta publicado, nao como app novo.
  #
  # Setup no painel do Codemagic (uma vez):
  #   1. Teams/Personal Account -> Integrations -> App Store Connect: integracao
  #      chamada `codemagic` (a mesma que o repo queroumacor-ios ja usa). Ela
  #      cobre assinatura (perfis gerados na hora) E upload pro TestFlight.
  #   2. Environment variables -> grupo `firebase` -> GOOGLE_SERVICE_INFO_PLIST
  #      = `base64 -w0 GoogleService-Info.plist` (marcar Secure). Mesma
  #      convencao do GOOGLE_SERVICES_JSON do Android: o arquivo nao fica no
  #      repo, a build materializa.
  #
  # O projeto Xcode (ios/App/App.xcodeproj) esta VERSIONADO — foi gerado por
  # `npx cap add ios` e commitado, com os arquivos curados (Info.plist,
  # PrivacyInfo.xcprivacy, AppDelegate.swift) por cima do boilerplate. Nao rode
  # `cap add ios` de novo: ele recusa quando ios/ existe e, se voce apagar a
  # pasta pra forcar, perde as customizacoes. Pra atualizar plugins use
  # `npx cap sync ios`, que e o que esta build faz.
  #
  # Disparo: manual pelo painel (sem bloco `triggering`).
  # ---------------------------------------------------------------------------
  ios-ipa:
    name: iOS IPA (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.queroumacor.app
      groups:
        - firebase # fornece GOOGLE_SERVICE_INFO_PLIST
      vars:
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        APP_STORE_APPLE_ID: 6784256495
      node: 20
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install deps (Capacitor CLI + plugins)
        script: npm ci

      # Sem esse arquivo o app CRASHA no boot: o pod CapacitorFirebaseMessaging
      # entra na build por causa do @capacitor-firebase/messaging no
      # package.json, e o FirebaseApp.configure() do AppDelegate nao acha a
      # config. Por isso falha explicito aqui em vez de gerar um IPA quebrado.
      # `openssl base64 -d -A` e nao `base64 --decode`: a flag longa e do GNU e
      # esta build roda em macOS.
      - name: GoogleService-Info.plist a partir da variavel
        script: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "ERRO: GOOGLE_SERVICE_INFO_PLIST vazio. Cadastre no grupo 'firebase'."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | openssl base64 -d -A > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          echo "GoogleService-Info.plist escrito e validado."

      # webDir (next-app/.next/static) nao existe em checkout limpo e o app
      # carrega tudo de server.url — um placeholder basta pro `cap sync` gerar o
      # capacitor.config.json e o ios/App/App/public. O sync tambem roda o
      # `pod install`, que precisa vir ANTES do use-profiles.
      - name: Placeholder webDir + Capacitor sync (roda pod install)
        script: |
          # Pagina de fallback offline, embutida no app. O Capacitor a exibe
          # (server.errorPath) quando a carga de server.url falha — sem rede, DNS
          # fora, site fora do ar. Sem isso o usuario ve a tela de erro crua do
          # sistema, que e o classico motivo de reprovacao 4.2 na Apple.
          # O botao recarrega o site; a pagina nao depende de nada externo.
          mkdir -p next-app/.next/static
          cat > next-app/.next/static/offline.html <<'HTML'
          <!doctype html><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <title>QueroUmaCor</title>
          <style>
            :root{color-scheme:dark}
            html,body{margin:0;height:100%;background:#1a1a2e;color:#fff;
              font:400 16px/1.6 -apple-system,system-ui,"Segoe UI",sans-serif;
              display:flex;align-items:center;justify-content:center;
              padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
              box-sizing:border-box;-webkit-user-select:none;user-select:none}
            .c{max-width:340px;text-align:center}
            .m{width:88px;height:88px;border-radius:50%;background:#FF6B35;margin:0 auto 22px;
              display:flex;align-items:center;justify-content:center;
              font:700 44px/1 -apple-system,system-ui,sans-serif;color:#fff}
            h1{font-size:21px;font-weight:700;margin:0 0 10px;letter-spacing:-.01em}
            p{margin:0 0 26px;opacity:.72;font-size:15px}
            button{-webkit-appearance:none;appearance:none;border:0;width:100%;
              padding:16px;border-radius:14px;background:#FF6B35;color:#fff;
              font:700 16px -apple-system,system-ui,sans-serif;cursor:pointer}
            button:active{opacity:.8}
          </style>
          <div class="c">
            <div class="m">Q</div>
            <h1>Sem conexão</h1>
            <p>O QueroUmaCor precisa de internet para carregar. Verifique sua conexão e tente de novo.</p>
            <button onclick="location.replace('https://www.queroumacor.com.br')">Tentar de novo</button>
          </div>
          HTML
          echo '<!doctype html><title>QueroUmaCor</title>' > next-app/.next/static/index.html
          npx cap sync ios

      - name: Assinatura — perfis do App Store Connect
        script: xcode-project use-profiles

      # CFBundleVersion = maior build do TestFlight + 1. Nunca repete, mesmo
      # entre app antigo (WebIntoApp) e este: os dois vivem no mesmo Apple ID.
      # Guardado: se o CLI falhar, cai no fallback pra nao derrubar a build.
      - name: CFBundleVersion = ultimo do TestFlight + 1
        script: |
          set +e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null)
          RC=$?
          set -e
          if [ $RC -eq 0 ] && echo "$LATEST" | grep -qE '^[0-9]+$'; then
            NEXT=$((LATEST + 1))
            echo "Maior build no TestFlight: $LATEST -> esta build: $NEXT"
          else
            NEXT="${IOS_BUILD_NUMBER:-10}"
            echo "get-latest-testflight-build-number indisponivel (rc=$RC) — fallback $NEXT"
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ios/App/App/Info.plist

      # O `xcode-project build-ipa` so imprime "Failed to archive" quando o
      # xcodebuild falha — a linha `error:` de verdade fica no log em
      # /tmp/xcodebuild_logs, que vira artefato e ninguem le. Sem isso, cada
      # falha de assinatura vira adivinhacao. Aqui a build se explica sozinha.
      - name: Build IPA assinado
        script: |
          if ! xcode-project build-ipa --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"; then
            echo "================= ERROS DO XCODEBUILD ================="
            grep -hE "error:|Provisioning profile|entitlement|[Cc]ode ?[Ss]ign|Signing for" /tmp/xcodebuild_logs/*.log 2>/dev/null | sort -u | tail -80
            echo "=============== FIM DOS ERROS ==============="
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - jackson.guerra@gmail.com
        notify:
          success: true
          failure: true
      # Sobe pro TestFlight. Promocao pra producao continua MANUAL no App Store
      # Connect — mesma regra do Android (Internal Testing -> producao na mao).
      app_store_connect:
        auth: integration
        submit_to_testflight: true
