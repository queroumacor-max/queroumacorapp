# .gitleaks.toml — configuração do scanner de segredos (CI: security.yml e
# rodada local `gitleaks git .` / `gitleaks dir .`).
#
# Auditoria de segredos 2026-09-11: a varredura de TODO o histórico (2157
# commits) achou UM segredo real, hoje removido — a chave Gemini hardcoded em
# `queroumacorportal.html` (commit a735531, 05/2026). Remover do código NÃO
# invalida a chave: ela precisa ser ROTACIONADA no Google AI Studio.
#
# Esse vazamento REAL fica registrado por FINGERPRINT em `.gitleaksignore`
# (commit:arquivo:regra:linha), NÃO por allowlist de commit: allowlist de
# commit esconde tudo que o commit contém; fingerprint esconde uma linha, e
# o arquivo diz por quê. Este toml só tem FALSOS POSITIVOS, cada um explicado.
#
# A regra padrão `gcp-api-key` (AIza + 35 chars, entropia >= 3) foi a que
# pegou a chave real (entropia 4,7). `scripts/secret-scan-selftest.sh` prova
# no CI que ela continua pegando: chave sintética -> scanner FALHA; árvore
# limpa -> scanner PASSA. Nunca desligar essa regra nem subir a entropia.

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conhecidos — cada um com motivo"
regexes = [
  # Anon key do Supabase (JWT com role=anon). Pública por design — a segurança
  # é a RLS. Está no bundle, no wrangler.toml e no portal de propósito.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3cWViYXF3ZWVoaWxqc3FraWZtIiwicm9sZSI6ImFub24i''',
  # Token de exemplo do jwt.io (sub=1234567890) usado como fixture de teste.
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.''',
  # Placeholder truncado do antigo .env.example ("eyJhbGciOiJIUzI1NiIs...").
  '''eyJhbGciOiJIUzI1NiIs\.\.\.''',
  # DSN público do Sentry (feito pra viver no bundle).
  '''https://[0-9a-f]{32}@o[0-9]+\.ingest\.us\.sentry\.io/[0-9]+''',
]
paths = [
  # `pemToPkcs8` contém as strings "-----BEGIN PRIVATE KEY-----" como
  # delimitadores de parse, não uma chave. O teste monta um PEM de 5 bytes.
  '''next-app/lib/api/_services/fcm\.ts''',
  '''next-app/__tests__/api/fcm\.test\.ts''',
  # Regexes de redação contêm os PREFIXOS das chaves (sk-, AIza, ghp_…).
  '''next-app/lib/sentry-helpers\.ts''',
  # Self-test do scanner: gera uma chave SINTÉTICA (não é credencial de
  # ninguém) num diretório temporário e exige que o gitleaks a acuse.
  '''scripts/secret-scan-selftest\.sh''',
  '''next-app/__tests__/lib/sentry-helpers\.test\.ts''',
  '''next-app/__tests__/api/log-error\.test\.ts''',
  # Imagens base64 (data:image/...) disparam heurística de entropia.
  '''\.(png|jpg|jpeg|webp|gif|svg)$''',
  '''package-lock\.json$''',
  # Saída de build e dependências (só entram no `gitleaks dir`; o `git` scan
  # já ignora porque nada disso é versionado).
  '''(^|/)node_modules/''',
  '''(^|/)\.next/''',
  '''(^|/)\.vercel/''',
  '''(^|/)\.open-next/''',
]
