name: Load Test (manual)

# Manual-only — load test custa egress e pode disparar rate-limit de
# Supabase/Cloudflare. Não roda automaticamente.
#
# Perfil `basic`: endpoints públicos do app. Informe `base_url` (ou o secret
#   LOAD_TEST_URL). NÃO use produção como alvo do basic: o WAF do Cloudflare
#   bloqueia IP de datacenter (GitHub Actions) e você mediria a página de
#   bloqueio, não o app. Use o preview (…workers.dev).
#
# Perfil `completo`: feed/busca/trending/produtos direto no Supabase (REST),
#   que NÃO passa pelo Cloudflare, então roda do runner sem bater no WAF.
#   Carrega o Supabase de PRODUÇÃO (é o único banco) — só leitura, mas é o
#   DB real. Precisa dos secrets: NEXT_PUBLIC_SUPABASE_URL,
#   NEXT_PUBLIC_SUPABASE_ANON_KEY, LOAD_TEST_EMAIL, LOAD_TEST_PASSWORD
#   (conta de teste com e-mail confirmado).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Perfil: basic (rotas públicas) ou completo (feed/busca no Supabase de produção)'
        type: choice
        options:
          - basic
          - completo
        default: basic
      vus:
        description: 'Usuários simultâneos no platô'
        default: '100'
        type: string
      duration:
        description: 'Duração do platô (ex.: 3m)'
        default: '3m'
        type: string
      base_url:
        description: 'basic: Base URL alvo (ou secret LOAD_TEST_URL). Ignorado no completo.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinado por commit SHA (tag @v1 é mutável).
      - name: Setup k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1

      - name: Run k6 load test
        run: |
          if [ "$PROFILE" = "completo" ]; then
            if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
              echo "::error::completo exige os secrets NEXT_PUBLIC_SUPABASE_URL e NEXT_PUBLIC_SUPABASE_ANON_KEY."
              exit 1
            fi
            if [ -z "$LOAD_TEST_EMAIL" ] || [ -z "$LOAD_TEST_PASSWORD" ]; then
              echo "::error::completo exige os secrets LOAD_TEST_EMAIL e LOAD_TEST_PASSWORD (conta de teste)."
              exit 1
            fi
          else
            if [ -z "$BASE_URL" ]; then
              echo "::error::basic exige base_url (ou o secret LOAD_TEST_URL)."
              exit 1
            fi
          fi
          k6 run scripts/load-test.js
        env:
          PROFILE: ${{ inputs.profile }}
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
          BASE_URL: ${{ inputs.base_url || secrets.LOAD_TEST_URL }}
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          LOAD_TEST_EMAIL: ${{ secrets.LOAD_TEST_EMAIL }}
          LOAD_TEST_PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
          APP_URL: ${{ secrets.LOAD_TEST_URL }}
