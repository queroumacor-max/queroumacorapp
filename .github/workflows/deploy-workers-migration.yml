name: Deploy Workers Migration (manual, isolado de produção)

# Disparo MANUAL apenas, e só existe pra testar a migração pro Cloudflare
# Workers (ver docs/adr/0006-opennext-cloudflare-deploy-pipeline.md e
# docs/adr/0006-workers-migration-artifacts.md) SEM tocar em produção.
#
# Diferente de deploy.yml (Pages, produção): este workflow NÃO tem guard de
# branch — o objetivo é justamente rodar contra uma branch de FEATURE (via
# `ref` no dispatch), que é onde o código do adapter OpenNext/wrangler.jsonc
# vive enquanto a migração não é decidida. O comando wrangler nunca usa
# `--branch=main` nem mexe em Custom Domain/DNS — o resultado é sempre um
# Worker publicado só em `*.workers.dev` (ou uma Version dele, sem mover
# tráfego), nunca em queroumacor.com.br.
#
# Este arquivo só existe NA raiz de `main` pra o GitHub reconhecer o evento
# `workflow_dispatch` (exigência da API); quando dispatchado com `ref`
# apontando pra uma branch de feature, o conteúdo REAL que roda é o desta
# mesma branch — inclusive as env vars/comandos podem divergir do que está
# aqui, se a branch tiver uma versão mais nova deste arquivo.
on:
  workflow_dispatch:
    inputs:
      wrangler_command:
        description: >-
          Comando wrangler a rodar depois do build. 'deploy --env preview'
          CRIA o Worker queroumacor-next-preview a primeira vez (wrangler
          recusa 'versions upload' num Worker que ainda não existe —
          confirmado rodando de verdade, run 35418776307: "You cannot
          upload a new version of a Worker that does not yet exist").
          'versions upload --env preview' só funciona DEPOIS que o Worker
          já existe — cria uma Version sem mover tráfego (repetível).
          'deploy --env production' publica de verdade no Worker
          queroumacor-next-production (ainda assim só em *.workers.dev,
          nunca em queroumacor.com.br — routes ficam comentadas no
          wrangler.jsonc até o corte de DNS ser decidido à parte).
        required: true
        default: 'deploy --env preview'
        type: choice
        options:
          - 'deploy --env preview'
          - 'versions upload --env preview'
          - 'deploy --env production'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-app
    steps:
      # persist-credentials:false — mesma regra do deploy.yml: este job
      # nunca dá git push, deploy é via wrangler/API da Cloudflare.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Node 22, não 20 — `wrangler@4.134.0` (o pinado em package.json pra
      # esta migração) exige >=22 (`engines`). Com Node 20 o wrangler-action
      # detecta a incompatibilidade e REINSTALA sozinho um `wrangler@3.90.0`
      # por baixo — versão antiga que não lê `env.preview`/`main` do
      # `wrangler.jsonc` do jeito esperado ("Missing entry-point", "No
      # environment found"), falha comprovada rodando de verdade contra
      # queroumacor-max/queroumacorapp#344 (run 35326111897). deploy.yml
      # (produção, Pages) continua em Node 20 de propósito — main ainda usa
      # wrangler ^3.78, que não exige 22; não copiar esta mudança pra lá sem
      # também migrar o wrangler de produção.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install deps
        run: npm ci

      # Um step só — opennextjs-cloudflare build (dentro de build:cf) já
      # roda o next build por conta própria. As 4 NEXT_PUBLIC_* de
      # build-time (ver docs/adr/0006-workers-migration-artifacts.md seção
      # 2) precisam estar NESTE step — env: do GitHub Actions é por STEP,
      # não persiste pro seguinte.
      - name: Build Cloudflare Worker output
        run: npm run build:cf
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

      - name: Scan artifact for stray source maps / secrets
        run: |
          set -e
          if [ ! -d .open-next ]; then
            echo "::error::.open-next não existe — build:cf não gerou o artefato esperado (branch sem o adapter OpenNext?)."
            exit 1
          fi
          MAPS=$(find .open-next -iname '*.map' | wc -l)
          if [ "$MAPS" -ne 0 ]; then
            echo "::error::$MAPS arquivo(s) .map encontrados no artefato publicado."
            find .open-next -iname '*.map'
            exit 1
          fi
          if find .open-next -iname '.env*' | grep -q .; then
            echo "::error::arquivo .env encontrado no artefato publicado."
            exit 1
          fi

      # Mesmo SHA pinado que o deploy.yml de produção usa.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: next-app
          command: ${{ inputs.wrangler_command }}
