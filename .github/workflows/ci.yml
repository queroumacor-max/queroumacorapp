name: CI

# Roda em TODA branch (main inclusa — fix C5 da auditoria 2026-08-26: com
# branches-ignore:[main], merge em main não rodava lint/typecheck/teste
# nenhum, e o deploy automático do CF Pages não espera CI) e em PRs pra main.
# Falha bloqueia o merge quando a branch protection exigir o job `validate`.
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # 10min era apertado demais: em runners lentos o job era CANCELADO no meio
    # do npm ci/typecheck ANTES dos testes rodarem (2 cancelamentos seguidos em
    # 2026-09-03), deixando o check obrigatório vermelho sem falha real. 20min
    # dá folga pra npm ci + audit + lint + typecheck + ~1481 testes.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: next-app
    steps:
      # persist-credentials:false — este job só lê o repo (npm ci, lint,
      # typecheck, testes); nunca dá `git push`. Sem a credencial persistida,
      # um postinstall malicioso de uma dependência de PR não tem como usar
      # o GITHUB_TOKEN pra escrever no repo (defesa em profundidade — o
      # token de PR de fork já é read-only por padrão do GitHub, isto cobre
      # também o caso de push de branch same-repo).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fail-fast em vulnerabilidades HIGH/CRITICAL de prod deps. Roda
      # cedo pra não desperdiçar tempo de lint/test se já temos CVE
      # bloqueante. --omit=dev ignora devDeps (não vão pro browser).
      #
      # SEGURANÇA (auditoria 2026-09-18, achado MEDIUM): este step tinha
      # `continue-on-error: true`, o que fazia o job (e o check obrigatório
      # `validate`) ficar VERDE mesmo com CVE HIGH/CRITICAL numa dependência
      # de produção — o comentário acima sempre disse "fail-fast", mas o
      # step nunca falhava de verdade. Removido: agora um CVE bloqueante
      # numa dep de prod barra o merge de verdade, como o nome do step
      # sempre prometeu.
      #
      # INFRA (2026-09-19): a partir de hoje a npm registry aposentou o
      # endpoint "quick" de audit (`POST /-/npm/v1/security/audits/quick`,
      # usado por `npm audit` sem flag de formato) — toda chamada passou a
      # devolver 400 "Invalid package tree" + `npm error audit endpoint
      # returned an error`, reproduzido local com `npm ci` limpo + `npm
      # audit` num lockfile sem nenhuma mudança (e confirmado batendo
      # também no push mais recente de `main`, sem relação com qualquer PR
      # específico). Manter o step assim derrubaria `validate` em TODA
      # branch até a npm terminar a migração; voltar a `continue-on-error:
      # true` reabriria o achado MEDIUM de cima. Em vez disso: roda com
      # `--json`, e só falha o job quando o JSON tem `metadata` (ou seja, a
      # registry terminou o audit de verdade e achou algo no nível
      # bloqueante) — resposta de erro do endpoint (sem `metadata`) vira um
      # aviso visível, não um bloqueio.
      - name: npm audit (fail-fast)
        run: |
          set +e
          npm audit --audit-level=high --omit=dev --json > /tmp/npm-audit.json
          AUDIT_EXIT=$?
          set -e
          if [ "$AUDIT_EXIT" -eq 0 ]; then
            echo "npm audit: sem vulnerabilidade HIGH/CRITICAL em deps de produção."
            exit 0
          fi
          node -e "
            const fs = require('fs');
            let report;
            try {
              report = JSON.parse(fs.readFileSync('/tmp/npm-audit.json', 'utf8'));
            } catch (e) {
              console.log('::warning::npm audit: saída não era JSON válido (provável falha de infra do registry) — não bloqueando o merge por isso.');
              process.exit(0);
            }
            if (!report || typeof report !== 'object' || !('metadata' in report)) {
              const detail = (report && (report.body || report.error || report.message)) || report;
              console.log('::warning::npm audit: o endpoint do registry não completou o audit (não é CVE encontrado) — ' + JSON.stringify(detail));
              process.exit(0);
            }
            console.error('npm audit encontrou vulnerabilidade HIGH/CRITICAL em dependência de produção:');
            console.error(JSON.stringify(report.metadata && report.metadata.vulnerabilities, null, 2));
            process.exit(1);
          "

      # ESLint via next lint (config em .eslintrc.json).
      - name: ESLint
        run: npm run lint
        continue-on-error: false

      # TypeScript check.
      - name: TypeScript
        run: npm run typecheck

      # Tests (Vitest).
      - name: Tests (Vitest)
        run: npm test
