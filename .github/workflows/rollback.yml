name: Rollback main

# Reverte main pro commit anterior (ou um SHA escolhido) via force-push.
# O deploy da versão anterior sai do build nativo do Cloudflare Pages (git
# integration, que observa a branch main diretamente) — NÃO do deploy.yml
# deste repo, que hoje é workflow_dispatch-only (não dispara em push; ver
# comentário no topo de deploy.yml). Só manual — protegido por input
# `confirm=ROLLBACK`.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "SHA alvo (default: HEAD~1 de main)"
        required: false
        default: ""
      confirm:
        description: 'Digite ROLLBACK pra confirmar'
        required: true
        default: ""

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Maior blast radius do repo (force-push em `main`). Referenciar este
    # environment permite anexar uma proteção de "required reviewers" em
    # Settings → Environments → production-rollback (ação manual — sem
    # essa configuração, o environment aqui é inerte e não muda o
    # comportamento do job). Ver docs/EXTERNAL_SECURITY_BASELINE.md §15.
    environment: production-rollback
    steps:
      # Inputs de workflow_dispatch só podem vir de quem já tem permissão de
      # escrita pra disparar o workflow — não é o modelo de ameaça de PR de
      # fork. Mesmo assim, passamos por env em vez de interpolar
      # `${{ github.event.inputs.* }}` direto no `run:` (regra geral do
      # projeto pra qualquer contexto do GitHub, auditoria 2026-09-16):
      # interpolação direta vira texto do script ANTES do shell rodar, então
      # um valor com aspas/backticks quebraria o quoting; via env, o shell
      # sempre trata o conteúdo como dado.
      - name: Validate confirm input
        env:
          CONFIRM_INPUT: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM_INPUT" != "ROLLBACK" ]; then
            echo "Confirmacao invalida. Esperado literal 'ROLLBACK'."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "claude-bot"
          git config user.email "claude-bot@users.noreply.github.com"

      - name: Reset main to target
        env:
          TARGET_SHA_INPUT: ${{ github.event.inputs.target_sha }}
        run: |
          target="$TARGET_SHA_INPUT"
          if [ -z "$target" ]; then
            target="HEAD~1"
          fi
          # Recusa qualquer coisa começando com "-": git interpretaria como
          # flag em vez de ref (argument injection em `git reset --hard`).
          case "$target" in
            -*)
              echo "target_sha inválido (não pode começar com '-'): $target"
              exit 1
              ;;
          esac
          echo "Resetting main to: $target"
          git reset --hard "$target"
          echo "NEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Force push main
        run: git push --force origin main

      - name: Report
        run: |
          echo "main agora aponta para: $NEW_SHA"
          echo "deploy.yml NÃO dispara sozinho (é workflow_dispatch-only)."
          echo "Quem redeploya a versão antiga é o Cloudflare Pages Git"
          echo "integration, que observa pushes em main diretamente — sem"
          echo "ação extra aqui. Acompanhar em CF Pages Dashboard >"
          echo "Deployments (~90s) ou GitHub > Actions (se o build do CF"
          echo "estiver espelhado como check)."
