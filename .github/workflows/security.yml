name: Security Scan

# npm audit roda em PR e na cron semanal. ZAP só na cron (scan completo
# é pesado, ~5-10min). Falha em HIGH/CRITICAL; LOW/MODERATE só avisam.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # segunda-feira 08:00 UTC (05:00 BRT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Vanilla foi removido — npm audit roda só no next-app abaixo.

      # Audit do next-app (deps de runtime: next/react/supabase/sentry).
      - name: npm audit (next-app)
        working-directory: next-app
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm audit --audit-level=high --omit=dev
          else
            echo "next-app sem lockfile; instalando antes do audit"
            npm install --package-lock-only
            npm audit --audit-level=high --omit=dev
          fi

  gitleaks:
    # Auditoria de segredos 2026-09-11: varre o diff do PR (e, no agendado,
    # o histórico inteiro) com a config de `.gitleaks.toml`. Falso positivo
    # novo = entrada explicada na allowlist, nunca desligar o job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
      # Self-test: um scanner que passa em silêncio não prova nada. Baixa o
      # MESMO binário e exige que uma chave Google SINTÉTICA seja acusada
      # (exit 1) e que um diretório limpo passe (exit 0). Se a regra
      # `gcp-api-key` for desligada ou enfraquecida, este passo cai.
      - name: Self-test do scanner (chave sintética -> FAIL, limpo -> PASS)
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          scripts/secret-scan-selftest.sh /tmp/gitleaks

  zap-baseline:
    # Scan passivo (não dispara payloads). Roda só na cron pra não atrasar
    # PR. allow_issue_writing:false → não polui Issues do repo a cada run.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: 'https://queroumacor.com.br'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          cmd_options: '-a'
