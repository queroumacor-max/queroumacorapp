name: Security Scan

# npm audit roda em PR e na cron semanal. ZAP só na cron (scan completo
# é pesado, ~5-10min). Falha em HIGH/CRITICAL; LOW/MODERATE só avisam.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1' # segunda-feira 08:00 UTC (05:00 BRT)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Vanilla foi removido — npm audit roda só no next-app abaixo.

      # Audit do next-app (deps de runtime: next/react/supabase/sentry).
      - name: npm audit (next-app)
        working-directory: next-app
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            npm audit --audit-level=high --omit=dev
          else
            echo "next-app sem lockfile; instalando antes do audit"
            npm install --package-lock-only
            npm audit --audit-level=high --omit=dev
          fi

  gitleaks:
    # Auditoria de segredos 2026-09-11/15: varre o diff do PR (e, no
    # agendado, o histórico inteiro) com a config de `.gitleaks.toml`.
    # Falso positivo novo = entrada explicada na allowlist, nunca desligar
    # o job. Recuperado de uma branch que nunca foi mergeada
    # (claude/admiring-turing-20zlkj) — trazido isolado, sem o resto
    # daquela branch (que estava muito atrás de main).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pinado por commit SHA (a tag @v2 é mutável): esta action roda com
      # GITHUB_TOKEN no ambiente. SHA = tag v2 dereferenciada em 2026-09-16.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
      # Self-test: um scanner que passa em silêncio não prova nada. Baixa o
      # MESMO binário e exige que uma chave Google SINTÉTICA seja acusada
      # (exit 1) e que um diretório limpo passe (exit 0). Se a regra
      # `gcp-api-key` for desligada ou enfraquecida, este passo cai.
      - name: Self-test do scanner (chave sintética -> FAIL, limpo -> PASS)
        run: |
          set -euo pipefail
          V=8.21.2
          curl -sSL -o /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          scripts/secret-scan-selftest.sh /tmp/gitleaks

  sbom:
    # SBOM (CycloneDX) do next-app — inventário de dependências pra
    # resposta a incidente (ex.: "isso usa a lib X vulnerável?" vira busca
    # em vez de investigação). Gerado a partir do package-lock.json real (via
    # `--type application` e sem rede: cyclonedx-npm lê só o lockfile), não
    # publicado publicamente — fica só como artifact do run, retenção curta.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # --package-lock-only: lê só o package-lock.json, sem instalar
      # node_modules nem rodar install script de dependência nenhuma —
      # o job de SBOM não precisa (nem deve) executar código de terceiros.
      # --ignore-npm-errors: o `.npmrc` do next-app usa legacy-peer-deps=true
      # de propósito (ver comentário no arquivo — teto de peer do
      # @cloudflare/next-on-pages), o que faz `npm ls` reportar peers
      # "missing" que na prática nunca são usados; sem essa flag o gerador
      # aborta no mesmo aviso que o install já tolera.
      - name: Generate CycloneDX SBOM
        working-directory: next-app
        run: npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --package-lock-only --ignore-npm-errors --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-next-app
          path: next-app/sbom.cdx.json
          retention-days: 30

  zap-baseline:
    # Scan passivo (não dispara payloads). Roda só na cron pra não atrasar
    # PR. allow_issue_writing:false → não polui Issues do repo a cada run.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinado por commit SHA (tag @v0.13.0 é mutável). Sem secrets neste
      # job (alvo é a URL pública de produção), risco baixo, mas mesma regra.
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://queroumacor.com.br'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          cmd_options: '-a'
