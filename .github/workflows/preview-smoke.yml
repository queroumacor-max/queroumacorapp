# Temporário (PR #480): Playwright contra o Worker de preview. O sandbox
# do Claude não alcança workers.dev; o runner do GitHub alcança.
name: Preview smoke (temporário)
on:
  push:
    branches: [ccr-9f21767f-vff8ua]
    paths: [scripts/preview-smoke.mjs, .github/workflows/preview-smoke.yml]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: node scripts/preview-smoke.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-screens
          path: preview-login.png
