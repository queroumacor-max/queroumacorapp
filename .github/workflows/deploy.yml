name: Deploy to Cloudflare Pages

# Disparo MANUAL apenas. O deploy automático de produção é feito pelo build
# nativo do Cloudflare Pages (Git integration, env vars do painel CF). Este
# workflow rodava também em push pra main e competia com ele pelo slot de
# production do projeto queroumacor-next — quem terminasse por último vencia,
# com env vars de fontes diferentes (GitHub Secrets vs painel CF).
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch deixa escolher QUALQUER branch/ref na UI do Actions,
    # mas o comando wrangler abaixo é fixo em `--branch=main` (produção) —
    # sem este guard, rodar o dispatch numa branch de feature publicaria o
    # conteúdo dela como produção, sem passar pelo `validate` do ci.yml nem
    # por revisão de PR. Auditoria de segurança CI/CD, 2026-09-13.
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: next-app
    steps:
      # persist-credentials:false — este job nunca dá `git push` (o deploy é
      # via wrangler/API do Cloudflare, não via git); sem a credencial
      # persistida, um postinstall/build script malicioso não tem como usar
      # o GITHUB_TOKEN pra escrever no repo.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: next-app/package-lock.json

      # npm ci (não npm install): respeita o lockfile e falha se ele estiver
      # desatualizado, em vez de re-resolver dependências silenciosamente.
      - name: Install deps
        run: npm ci

      # Auditoria de segurança CI/CD 2026-09-16: SUPABASE_SERVICE_ROLE_KEY
      # NÃO é lida em build-time em lugar nenhum — o runtime é o edge do
      # Cloudflare Workers, que lê segredos via getRuntimeEnv() do CONTEXTO
      # DA REQUEST (env vars configuradas no painel do CF Pages), nunca de
      # process.env populado no momento do `next build` (ver regra
      # "process.env cru" no CLAUDE.md). Só NEXT_PUBLIC_* precisam estar
      # presentes aqui, porque o next.config.mjs os INLINE no bundle do
      # cliente durante o build. Passar a service role key pra esta etapa
      # só aumentava a superfície: qualquer script malicioso rodando durante
      # `npm ci`/`next build` (postinstall de dependência comprometida)
      # teria acesso de leitura irrestrita ao banco via essa chave.
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build Cloudflare Pages output
        run: npm run build:cf

      - name: Scan artifact for stray source maps / secrets
        run: |
          set -e
          MAPS=$(find .vercel/output/static -iname '*.map' | wc -l)
          if [ "$MAPS" -ne 0 ]; then
            echo "::error::$MAPS arquivo(s) .map encontrados no artefato publicado — source maps não podem ir pro Cloudflare Pages."
            find .vercel/output/static -iname '*.map'
            exit 1
          fi
          if find .vercel/output/static -iname '.env*' | grep -q .; then
            echo "::error::arquivo .env encontrado no artefato publicado."
            exit 1
          fi

      # Pinado por commit SHA (não a tag mutável @v3): esta action recebe
      # CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID — se a tag `v3` fosse
      # remarcada (conta do mantenedor comprometida), o próximo run
      # executaria código arbitrário com os dois secrets de deploy em mãos.
      # SHA resolvido de refs/tags/v3 em 2026-09-16; Dependabot (github-
      # actions ecosystem) mantém isso atualizado abrindo PR quando o SHA
      # de v3 avançar.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: next-app
          command: pages deploy .vercel/output/static --project-name=queroumacor-next --branch=main --commit-dirty=true
